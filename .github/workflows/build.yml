name: Build

# The build gate for every PR, hand-written or opened by the
# update-claude-desktop workflow (which no longer builds anything itself).
# Builds both architectures on native runners, so fetchurl re-verifies both
# pinned deb hashes against the real downloads and autoPatchelfHook catches
# new dependencies on either arch.
#
# Branch protection: mark **`Build gate`** as the required check, not the
# `build` matrix legs, which skip on docs-only changes.
#
# Path filtering deliberately lives on the jobs, not on `on:`. A filter at the
# `on:` level skips the whole workflow on a docs-only PR, so a required check
# inside it never reports and the PR blocks forever waiting on a job that will
# never run. Instead the workflow always triggers, a `changes` job decides
# whether the expensive work is needed, and `Build gate` always reports —
# passing when the build legitimately did not need to run.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether anything build-relevant changed. Done with git rather than a
  # third-party paths-filter action to keep the dependency surface small.
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Diff against the base
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          # A manual dispatch is always an explicit request to build.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "workflow_dispatch — building unconditionally"
            exit 0
          fi

          if [ "$EVENT" = "pull_request" ]; then
            RANGE="$BASE...$HEAD"
          else
            # First push to a new branch reports an all-zero `before`; there is
            # no usable range, so fall back to building.
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              echo "relevant=true" >> "$GITHUB_OUTPUT"
              echo "no usable before-sha — building unconditionally"
              exit 0
            fi
            RANGE="$BEFORE..$AFTER"
          fi

          # Fail open: if the range can't be resolved (force-push, shallow
          # history), build rather than silently skip verification.
          if ! CHANGED=$(git diff --name-only "$RANGE" 2>/dev/null); then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "could not diff $RANGE — building unconditionally"
            exit 0
          fi

          echo "Changed files:"
          echo "$CHANGED" | sed 's/^/  /'

          if echo "$CHANGED" | grep -qE '^(pkgs/|flake\.nix$|flake\.lock$|\.github/workflows/build\.yml$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "-> build-relevant changes found"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "-> nothing build-relevant; build will be skipped"
          fi

  build:
    name: nix build (${{ matrix.system }})
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    strategy:
      # Report both arches even when one fails.
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          # Free for public repos. Before this the arm64 deb was never even
          # downloaded by CI, so its hash and its dependencies went unchecked.
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: NIXPKGS_ALLOW_UNFREE=1 nix build .#claude-desktop --impure -L

      # Codifies the automated rows of TESTING.md. autoPatchelfHook and
      # fetchurl already failed the build above if deps or the amd64 hash were
      # wrong; these cover the packaging invariants that can regress silently
      # when upstream moves things around.
      - name: Check packaging invariants
        run: |
          set -euo pipefail
          OUT=$(readlink -f result)
          rc=0

          shopt -s nullglob
          desktopFiles=("$OUT"/share/applications/*.desktop)
          shopt -u nullglob
          if [ ${#desktopFiles[@]} -ne 1 ]; then
            echo "::error::expected exactly one .desktop file, found ${#desktopFiles[@]}"
            exit 1
          fi
          desktopFile="${desktopFiles[0]}"
          desktopName=$(basename "$desktopFile")
          echo "Desktop file: $desktopName"

          # Every Exec= must point into the store, not at a bare PATH lookup —
          # a missed replacement still "works" on a machine that happens to
          # have claude-desktop in PATH, so it can't be caught by launching it.
          if grep -q '^Exec=claude-desktop' "$desktopFile"; then
            echo "::error::unpatched PATH-relative Exec= in $desktopName"
            grep -n '^Exec=' "$desktopFile"
            rc=1
          fi
          # `|| true`: grep -c exits 1 on zero matches, which under `set -e`
          # would abort here and skip the diagnostic below.
          execCount=$(grep -c "^Exec=$OUT/bin/claude-desktop" "$desktopFile" || true)
          echo "Exec= lines pointing at the wrapper: $execCount"
          if [ "$execCount" -lt 1 ]; then
            echo "::error::no Exec= line points at the wrapper"
            rc=1
          fi

          # CHROME_DESKTOP drives Wayland/GNOME window-to-launcher association;
          # if it drifts from the shipped filename nothing errors, windows just
          # stop grouping under the app icon.
          if ! grep -q "CHROME_DESKTOP='$desktopName'" "$OUT"/bin/claude-desktop; then
            echo "::error::CHROME_DESKTOP does not match $desktopName"
            grep -o "CHROME_DESKTOP.*" "$OUT"/bin/claude-desktop || true
            rc=1
          fi

          # Must not be present at all: a non-SUID chrome-sandbox makes
          # Chromium abort with a FATAL instead of falling back to userns.
          if [ -e "$OUT/lib/claude-desktop/chrome-sandbox" ]; then
            echo "::error::chrome-sandbox still present in the output"
            rc=1
          fi

          # --inputs-from . resolves nixpkgs from this flake's lock rather than
          # the global registry, so this validates with the same nixpkgs that
          # built the package.
          nix shell --inputs-from . nixpkgs#desktop-file-utils \
            -c desktop-file-validate "$desktopFile" || rc=1

          exit $rc

  # THIS is the job to mark required in branch protection.
  #
  # It runs on every PR regardless of what changed, so it always reports a
  # status. `skipped` counts as passing — that is the whole point: a docs-only
  # PR legitimately does not need a build, and must not be blocked waiting on
  # one. Anything else (failure, cancelled) fails the gate.
  gate:
    name: Build gate
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check upstream job results
        env:
          CHANGES: ${{ needs.changes.result }}
          # Aggregated over the matrix: failure if either arch failed.
          BUILD: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          echo "changes=$CHANGES  build=$BUILD"
          rc=0

          # Change detection failing is itself a gate failure: without it we
          # don't know whether the skips below were legitimate.
          if [ "$CHANGES" != "success" ]; then
            echo "::error::change detection did not succeed ($CHANGES)"
            rc=1
          fi

          check() {
            case "$2" in
              success) echo "$1: passed" ;;
              skipped) echo "$1: skipped (no build-relevant changes)" ;;
              *)       echo "::error::$1 did not pass ($2)"; rc=1 ;;
            esac
          }
          check build "$BUILD"

          [ $rc -eq 0 ] && echo "Gate passed." || echo "Gate failed."
          exit $rc
