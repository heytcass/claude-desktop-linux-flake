name: Update Claude Desktop

# Hourly: reads the latest version from Anthropic's official apt repository Packages
# index (the same metadata `apt upgrade` trusts) and, if it differs from
# pkgs/sources.json, rewrites the version and per-arch deb hashes and opens
# (or refreshes) a single auto-merging PR.
#
# This workflow deliberately builds nothing. build.yml on the PR is the gate:
# it builds both architectures, which re-verifies both hashes against the real
# downloads. A release that breaks the build therefore shows up as a red PR
# that never merges, rather than a failed scheduled run nobody looks at (how
# 2.31226.1's new libpipewire dependency went unnoticed).
#
# Token: Build runs on PRs opened with GITHUB_TOKEN sit waiting for a
# maintainer to approve them (#118's first run expired after 30 days; #125
# waited six), so "auto-merge" was never automatic. When the UPDATER_APP_CLIENT_ID
# variable and UPDATER_APP_PRIVATE_KEY secret are set, the PR is opened and
# merged as that GitHub App instead and checks start on their own. Without
# them it falls back to GITHUB_TOKEN and behaves as before.

on:
  schedule:
    # Hourly, not daily: GitHub delays scheduled runs under load and sometimes
    # drops them. The once-a-day 09:23 run fired at 14:13 on 2026-10-15 and not
    # at all by 13:00 the next day, while 2.42304.0 sat in the index. A run with
    # nothing new takes ~10s, so polling hourly costs nothing and a missed run
    # is covered by the next one.
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Force a specific version (optional; auto-detected from the apt Packages index otherwise)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-claude-desktop
  cancel-in-progress: false

env:
  APT_DIST: https://downloads.claude.ai/claude-desktop/apt/stable/dists/stable
  SOURCES: pkgs/sources.json

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Determine latest version
      id: check
      env:
        FORCED: ${{ inputs.version }}
      run: |
        set -euo pipefail

        CURRENT=$(jq -r .version "$SOURCES")
        echo "Current version: $CURRENT"

        if [ -n "$FORCED" ]; then
          LATEST="$FORCED"
          echo "Forced version: $LATEST"
        else
          LATEST=$(curl -fsSL "$APT_DIST/main/binary-amd64/Packages" \
            | grep -oP '^Version: \K.*' | sort -V | tail -1)
          echo "Latest version (apt Packages index): $LATEST"
        fi

        if [ -z "$LATEST" ]; then
          echo "::error::Could not read latest version from the apt Packages index"
          exit 1
        fi

        echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
        echo "latest=$LATEST"   >> "$GITHUB_OUTPUT"
        if [ "$CURRENT" != "$LATEST" ]; then
          echo "needs_update=true" >> "$GITHUB_OUTPUT"
        else
          echo "needs_update=false" >> "$GITHUB_OUTPUT"
          echo "Already on the latest version."
        fi

    - name: Repin pkgs/sources.json
      if: steps.check.outputs.needs_update == 'true'
      env:
        LATEST: ${{ steps.check.outputs.latest }}
      run: |
        set -euo pipefail

        # Pull an arch's deb SHA256 (hex) from its Packages stanza and convert
        # it to SRI. Nothing here is trusted on its own: build.yml builds both
        # arches on the PR, so fetchurl checks each hash against the real deb.
        sri_for_arch() {
          local hex
          hex=$(curl -fsSL "$APT_DIST/main/binary-$1/Packages" \
            | awk -v ver="$LATEST" '
                BEGIN { RS=""; FS="\n" }
                {
                  v=""; s=""
                  for (i = 1; i <= NF; i++) {
                    if ($i ~ /^Version: /) v = substr($i, 10)
                    if ($i ~ /^SHA256: /)  s = substr($i, 9)
                  }
                  if (v == ver) print s
                }' \
            | head -1)
          if ! [[ "$hex" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::No usable $1 SHA256 for version $LATEST (got '${hex}')" >&2
            return 1
          fi
          printf 'sha256-%s' "$(printf '%s' "$hex" | xxd -r -p | base64 -w0)"
        }

        AMD64=$(sri_for_arch amd64)
        ARM64=$(sri_for_arch arm64)

        jq -n --arg version "$LATEST" --arg amd64 "$AMD64" --arg arm64 "$ARM64" \
          '{version: $version, hashes: {amd64: $amd64, arm64: $arm64}}' > "$SOURCES"
        cat "$SOURCES"

    - name: Mint GitHub App token
      id: app-token
      if: steps.check.outputs.needs_update == 'true' && vars.UPDATER_APP_CLIENT_ID != ''
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ vars.UPDATER_APP_CLIENT_ID }}
        private-key: ${{ secrets.UPDATER_APP_PRIVATE_KEY }}
        permission-contents: write
        permission-pull-requests: write
        # Rebasing the rolling branch onto a main whose workflow files changed
        # counts as "updating a workflow"; GitHub rejects that push without it.
        # (GITHUB_TOKEN can't be granted this, so the fallback path fails in
        # that one case until the stale PR is closed.)
        permission-workflows: write

    - name: Create or update pull request
      if: steps.check.outputs.needs_update == 'true'
      id: pr
      uses: peter-evans/create-pull-request@v8
      with:
        token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        # One rolling branch, so a newer release supersedes a stuck PR instead
        # of opening a second one, and a fix landed on main (like a new
        # buildInput) gets picked up by the next run rebasing the PR.
        # Don't push fixes to this branch: the next run rewrites it from main.
        branch: update-claude-desktop
        delete-branch: true
        commit-message: |
          feat: update Claude Desktop to version ${{ steps.check.outputs.latest }}

          Automated update from the Anthropic apt repository.
        title: 'Update Claude Desktop to version ${{ steps.check.outputs.latest }}'
        body: |
          ## Summary
          - Bumps Claude Desktop ${{ steps.check.outputs.current }} → ${{ steps.check.outputs.latest }}
          - Version detected from Anthropic's apt `Packages` index
          - amd64 + arm64 deb hashes repinned in `pkgs/sources.json` from the index's SHA256 fields

          Auto-merges once `Build gate` passes (x86_64 + aarch64 `nix build`, which re-verifies both hashes against the real debs). If it fails, fix it on `main`; the next hourly run rebases this PR onto the fix.

          🤖 Automated by the update-claude-desktop workflow.

    - name: Enable auto-merge
      # `--auto` is load-bearing: without it `gh pr merge` merges on the spot,
      # before build.yml has run. Requires `Allow auto-merge` on the repo and
      # `Build gate` as a required status check on main.
      if: steps.pr.outputs.pull-request-number
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        PR: ${{ steps.pr.outputs.pull-request-number }}
      run: |
        set -euo pipefail
        # A refreshed PR already has auto-merge armed; leave it alone.
        if [ "$(gh pr view "$PR" --json autoMergeRequest --jq '.autoMergeRequest != null')" = "true" ]; then
          echo "Auto-merge already enabled on #$PR"
        else
          gh pr merge "$PR" --auto --merge --delete-branch
        fi
